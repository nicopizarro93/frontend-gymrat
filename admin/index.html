<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin | GymRat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="gr-dark-section">
  <div class="gr-admin-shell d-flex">
    <aside class="gr-admin-sidebar p-3" style="width:240px;flex-shrink:0;">
      <a href="../index.html" class="brand d-inline-block mb-4">GYM<span>RAT</span></a>
      <nav class="nav flex-column">
        <a class="nav-link active" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="ejercicios.html"><i class="bi bi-lightning-charge me-2"></i>Ejercicios</a>
        <a class="nav-link" href="atletas.html"><i class="bi bi-people me-2"></i>Atletas</a>
        <a class="nav-link" href="../perfil.html"><i class="bi bi-person me-2"></i>Mi perfil</a>
        <a class="nav-link" href="../index.html"><i class="bi bi-box-arrow-left me-2"></i>Volver al sitio</a>
        <button type="button" class="nav-link border-0 bg-transparent text-start w-100" id="btnCerrarSesionAdmin">
          <i class="bi bi-power me-2"></i>Cerrar sesión
        </button>
      </nav>
    </aside>

    <main class="flex-grow-1 p-4 p-md-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-0">Dashboard</h1>
          <p class="text-muted mb-0">Resumen general de GymRat.</p>
        </div>
        <span class="badge bg-dark py-2 px-3" id="saludoAdmin"></span>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-3 col-6">
          <div class="gr-stat-card p-3">
            <div class="stat-value" id="statEjercicios">0</div>
            <small class="text-muted text-uppercase">Ejercicios</small>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="gr-stat-card p-3">
            <div class="stat-value" id="statRutinas">0</div>
            <small class="text-muted text-uppercase">Rutinas</small>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="gr-stat-card p-3">
            <div class="stat-value" id="statAtletas">0</div>
            <small class="text-muted text-uppercase">Atletas</small>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="gr-stat-card p-3">
            <div class="stat-value" id="statStaff">0</div>
            <small class="text-muted text-uppercase">Staff</small>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card gr-card p-4">
            <h2 class="h5 mb-3">Últimos atletas registrados</h2>
            <div class="table-responsive">
              <table class="table table-gr align-middle mb-0">
                <thead>
                  <tr><th>Nombre</th><th>RUT</th><th>Rol</th></tr>
                </thead>
                <tbody id="tablaUltimosAtletas"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card gr-card p-4">
            <h2 class="h5 mb-3">Ejercicios por grupo muscular</h2>
            <ul class="list-group list-group-flush" id="listaGrupos"></ul>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
