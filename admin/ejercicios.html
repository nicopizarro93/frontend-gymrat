<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios | Panel Admin GymRat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="gr-dark-section">
  <div class="gr-admin-shell d-flex">
    <aside class="gr-admin-sidebar p-3" style="width:240px;flex-shrink:0;">
      <a href="../index.html" class="brand d-inline-block mb-4">GYM<span>RAT</span></a>
      <nav class="nav flex-column">
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link active" href="ejercicios.html"><i class="bi bi-lightning-charge me-2"></i>Ejercicios</a>
        <a class="nav-link" href="atletas.html"><i class="bi bi-people me-2"></i>Atletas</a>
        <a class="nav-link" href="../perfil.html"><i class="bi bi-person me-2"></i>Mi perfil</a>
        <a class="nav-link" href="../index.html"><i class="bi bi-box-arrow-left me-2"></i>Volver al sitio</a>
        <button type="button" class="nav-link border-0 bg-transparent text-start w-100" id="btnCerrarSesionAdmin">
          <i class="bi bi-power me-2"></i>Cerrar sesión
        </button>
      </nav>
    </aside>

    <main class="flex-grow-1 p-4 p-md-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="h3 mb-0">Mantenedor de ejercicios</h1>
          <p class="text-muted mb-0">Crea, edita y elimina los ejercicios del catálogo.</p>
        </div>
        <button type="button" class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#modalEjercicio" id="btnNuevoEjercicio">
          <i class="bi bi-plus-lg"></i> Nuevo ejercicio
        </button>
      </div>

      <div class="card gr-card p-3 p-md-4">
        <div class="table-responsive">
          <table class="table table-gr align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th><th>Nombre</th><th>Grupo muscular</th><th>Dificultad</th><th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaEjercicios"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal crear/editar ejercicio -->
  <div class="modal fade" id="modalEjercicio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEjercicio" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalEjercicio">Nuevo ejercicio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idEjercicio" name="idEjercicio">
            <div class="mb-3">
              <label for="nombreEjercicio" class="form-label">Nombre del ejercicio</label>
              <input type="text" class="form-control" id="nombreEjercicio" name="nombreEjercicio" required>
            </div>
            <div class="mb-3">
              <label for="grupoMuscular" class="form-label">Grupo muscular</label>
              <select class="form-select" id="grupoMuscular" name="grupoMuscular" required>
                <option value="" selected disabled>Selecciona un grupo</option>
                <option value="PECHO">Pecho</option>
                <option value="ESPALDA">Espalda</option>
                <option value="PIERNA">Pierna</option>
                <option value="HOMBRO">Hombro</option>
                <option value="BICEP">Bícep</option>
                <option value="TRICEP">Trícep</option>
                <option value="ABDOMEN">Abdomen</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="dificultad" class="form-label">Dificultad</label>
              <select class="form-select" id="dificultad" name="dificultad" required>
                <option value="" selected disabled>Selecciona una dificultad</option>
                <option value="PRINCIPIANTE">Principiante</option>
                <option value="INTERMEDIO">Intermedio</option>
                <option value="AVANZADO">Avanzado</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-brand">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin-ejercicios.js"></script>
</body>
</html>
