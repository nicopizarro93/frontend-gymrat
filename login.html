<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | GymRat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="gr-dark-section">

  <nav class="navbar gr-light-navbar">
    <div class="container py-2">
      <a class="navbar-brand" href="index.html">GYM<span class="text-brand-red">RAT</span></a>
      <a href="index.html" class="btn btn-sm btn-outline-dark"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
    </div>
  </nav>

  <section class="gr-auth-wrap py-5">
    <div class="container">
      <div class="row justify-content-center align-items-center g-0">

        <div class="col-lg-4 gr-auth-side p-4 p-lg-5">
          <span class="gr-badge gr-badge-accent mb-3 d-inline-block">Bienvenido de vuelta</span>
          <h1>VUELVE A<br>ENTRENAR.</h1>
          <p style="color:var(--gr-gray-300);">Ingresa con tu correo o tu RUT para ver tus rutinas y seguir tu progreso.</p>
          <p class="small" style="color:var(--gr-gray-300);">¿Aún no tienes cuenta? <a href="registro.html" class="text-brand-red">Regístrate aquí</a>.</p>
        </div>

        <div class="col-lg-5">
          <div class="card gr-auth-card p-4 p-lg-5 mx-auto" style="max-width:520px;">
            <h2 class="h4 mb-4">Iniciar sesión</h2>

            <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="identificador" class="form-label">Correo o RUT</label>
                <input type="text" class="form-control" id="identificador" name="identificador" placeholder="tu@correo.com o 12345678-9" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-brand btn-lg">Ingresar</button>
              </div>
            </form>

            <div class="alert alert-light border mt-4 small mb-0">
              <strong>Cuenta de prueba (staff/admin):</strong><br>
              admin@gymrat.cl / admin123
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
